<form (ngSubmit)="createUser(myForm)" #myForm="ngForm">
    <label>Nom</label>
    <input type="text" name="name" ngModel>

    <label>Email</label>
    <input type="text" name="email" ngModel>

    <button>Créer</button>
</form>

<h1>Utilisateur recherché : {{ username() }}</h1>

@for (u of users$ | async ; track u.id) {
    <app-user-card [user]="u" />
}
